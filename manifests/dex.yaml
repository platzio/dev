apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: platz
data:
  config.yaml: |
    issuer: http://dex.platz.svc.cluster.local:5556
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    enablePasswordDB: true
    staticPasswords:
      - email: admin@example.com
        # bcrypt hash of "password" — used for local dev only.
        hash: "$2y$10$tNgtc1pqvAEKLpGB6aFlR.NUsS8TLk/H17EYoCUYL3QfFzf6XeXQy"
        username: admin
        userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    staticClients:
      - id: platz-local
        redirectURIs:
          - http://localhost:8080/auth/callback
          - http://127.0.0.1:8080/auth/callback
          - http://localhost:5173/auth/callback
        name: Platz Local
        secret: platz-local-secret
    oauth2:
      skipApprovalScreen: true
---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-config
  namespace: platz
type: Opaque
stringData:
  serverUrl: http://dex.platz.svc.cluster.local:5556
  clientId: platz-local
  clientSecret: platz-local-secret
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: platz
spec:
  selector:
    app: dex
  ports:
    - name: http
      port: 5556
      targetPort: 5556
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: platz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          image: dexidp/dex:v2.41.1
          args:
            - dex
            - serve
            - /etc/dex/config.yaml
          ports:
            - containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dex-config
