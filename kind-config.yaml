kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platz-local
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose ingress / NodePort traffic on the host so the frontend in the
      # browser can hit the cluster directly.
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
